version: '3.8'

services:
  freepbx_server:
    container_name: freepbx_server
    image: freepbx-docker:20.17
    restart: always

    ports:
      - "80:80"                              # HTTP
      - "443:443"                            # HTTPS
      - "4445:4445"                          # Alternative HTTPS
      - "4569:4569/udp"                      # IAX2
      - "5060:5060"                          # SIP TCP
      - "5060:5060/udp"                      # SIP UDP
      - "5160:5160/udp"                      # IAX2 RTP
      - "18000-18100:18000-18100/udp"        # RTP streams

    environment:
      # Timezone
      - TZ=${TZ:-Asia/Taipei}

      # Database Configuration (from .env)
      - DB_USER=${DB_USER:-asterisk}
      - DB_PASS=${DB_PASS}
      - DBNAME=${DBNAME:-asterisk}
      - DBHOST=${DBHOST:-freepbx_mariadb}
      - DBPORT=${DBPORT:-3306}
      - CDRDBNAME=${CDRDBNAME:-asteriskcdrdb}
      - DBENGINE=${DBENGINE:-mysql}

      # User and Group
      - USER=${USER:-asterisk}
      - GROUP=${GROUP:-asterisk}

      # FreePBX/Asterisk Directories
      - WEBROOT=${WEBROOT:-/var/www/html}
      - ASTETCDIR=${ASTETCDIR:-/etc/asterisk}
      - ASTMODDIR=${ASTMODDIR:-/usr/lib64/asterisk/modules}
      - ASTVARLIBDIR=${ASTVARLIBDIR:-/var/lib/asterisk}
      - ASTAGIDIR=${ASTAGIDIR:-/var/lib/asterisk/agi-bin}
      - ASTSPOOLDIR=${ASTSPOOLDIR:-/var/spool/asterisk}
      - ASTRUNDIR=${ASTRUNDIR:-/var/run/asterisk}
      - AMPBIN=${AMPBIN:-/var/lib/asterisk/bin}
      - AMPSBIN=${AMPSBIN:-/usr/sbin}
      - AMPCGIBIN=${AMPCGIBIN:-/var/www/cgi-bin}
      - AMPPLAYBACK=${AMPPLAYBACK:-/var/lib/asterisk/playback}

    volumes:
      # ========================================
      # Data Directory Structure
      # Mirrors OS directory hierarchy for clarity
      # 數據目錄結構對應 OS 路徑
      # ========================================

      # SSL Certificates
      - ./data/etc/apache2/certs:/etc/apache2/certs

      # Asterisk Configuration (CRITICAL)
      - ./data/etc/asterisk:/etc/asterisk

      # Asterisk Data & Libraries (CRITICAL)
      - ./data/var/lib/asterisk:/var/lib/asterisk

      # Asterisk Modules
      - ./data/usr/lib64/asterisk:/usr/lib64/asterisk

      # Asterisk Spool (voicemail, call recordings)
      - ./data/var/spool/asterisk:/var/spool/asterisk

      # Asterisk Logs
      - ./data/var/log/asterisk:/var/log/asterisk

      # Web Content (FreePBX web interface)
      - ./data/var/www/html:/var/www/html

      # Apache Configuration
      - ./data/etc/apache2/apache2.conf:/etc/apache2/apache2.conf

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      asterisk:
        ipv4_address: 192.168.0.3

    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    container_name: freepbx_mariadb
    image: mariadb:${MARIADB_VERSION:-10.11}
    restart: always

    volumes:
      # ========================================
      # MariaDB Data Directory
      # Mirrors OS directory hierarchy
      # ========================================

      # MySQL/MariaDB Data (bind mount)
      - ./data/var/lib/mysql:/var/lib/mysql

      # Database Initialization Scripts
      - ./sql:/docker-entrypoint-initdb.d

    environment:
      - TZ=${TZ:-Asia/Taipei}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DBNAME:-asterisk}
      - MYSQL_USER=${DB_USER:-asterisk}
      - MYSQL_PASSWORD=${DB_PASS}

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      asterisk:
        ipv4_address: 192.168.0.2

networks:
  asterisk:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
    ipam:
      driver: default
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.1
